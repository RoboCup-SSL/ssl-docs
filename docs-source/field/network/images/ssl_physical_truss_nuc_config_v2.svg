<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">In the one or two camera configuration, each camera has its own dedicated truss-mounted NUC, connected via USB 3.1. Each NUC is remotely accessed over GbE via the field-side switch. A two-camera config duplicates this camera-and-NUC pair.</desc>
