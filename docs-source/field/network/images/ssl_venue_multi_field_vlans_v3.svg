<svg width="100%" viewBox="0 0 680 410" role="img" style="" xmlns="http://www.w3.org/2000/svg">
<title style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">RoboCup SSL venue-level multi-field VLAN topology, mapped to per-field diagrams</title>
<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Typical big-event architecture, provided by venue networking staff: a shared router trunks tagged VLAN traffic to each field's switch. Field 1 is shown fully expanded, continuing into that field's truss cameras and field-side devices exactly as in the simpler per-field diagrams. Field 2 and additional fields follow the identical downstream pattern. VLAN IDs shown are illustrative only, as event staff typically control the router and switch configuration.</desc>
