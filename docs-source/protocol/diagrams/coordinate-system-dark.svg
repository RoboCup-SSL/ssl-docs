<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="sans-serif">
  <defs>
    <marker id="axis-arrow-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#22d3ee"/>
    </marker>
  </defs>

  <text x="320" y="24" text-anchor="middle" font-size="15" fill="#e2e8f0">SSL Vision Coordinate System (schematic, not to scale)</text>

  <!-- field boundary -->
  <rect x="60" y="60" width="520" height="300" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- axes -->
  <line x1="60" y1="210" x2="608" y2="210" stroke="#22d3ee" stroke-width="2" marker-end="url(#axis-arrow-dark)"/>
  <line x1="320" y1="360" x2="320" y2="32" stroke="#22d3ee" stroke-width="2" marker-end="url(#axis-arrow-dark)"/>
  <text x="600" y="203" text-anchor="end" font-size="14" fill="#22d3ee">+X</text>
  <text x="332" y="40" font-size="14" fill="#22d3ee">+Y</text>

  <!-- origin -->
  <circle cx="320" cy="210" r="4.5" fill="#e2e8f0"/>
  <text x="330" y="228" font-size="12" fill="#e2e8f0">origin (0, 0)</text>
  <text x="330" y="244" font-size="12" fill="#94a3b8">position units: mm</text>

  <!-- robot -->
  <g>
    <circle cx="420" cy="150" r="14" fill="#581c87" stroke="#c084fc" stroke-width="1.5"/>
    <!-- reference line, parallel to +X -->
    <line x1="420" y1="150" x2="460" y2="150" stroke="#c084fc" stroke-width="1" stroke-dasharray="3 3"/>
    <!-- heading line, orientation theta CCW from +X -->
    <line x1="420" y1="150" x2="452.8" y2="127.1" stroke="#c084fc" stroke-width="2"/>
    <!-- angle arc -->
    <path d="M 444 150 A 24 24 0 0 0 439.7 136.2" fill="none" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="452" y="145" font-size="12" fill="#fbbf24">&#952;</text>
  </g>
  <text x="420" y="188" text-anchor="middle" font-size="12" fill="#e9d5ff">robot</text>
  <text x="320" y="392" text-anchor="middle" font-size="12" fill="#fbbf24">orientation &#952;: radians, measured counter-clockwise from +X</text>
</svg>
